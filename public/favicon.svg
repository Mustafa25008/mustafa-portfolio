<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients for 3D Isometric Cube -->
    <!-- Top Face Gradient -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Neon Accent Ring -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Backdrop for browser tabs -->
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#neonRing)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Ambient Glow Behind 3D Shape -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle cx="280" cy="240" r="120" fill="#38bdf8" opacity="0.2" filter="url(#glow)"/>

  <!-- 3D Isometric Hexagon/Cube Group -->
  <g filter="url(#softShadow)" transform="translate(256, 256)">
    <!-- Top Face -->
    <polygon points="0,-160 138.56,-80 0,0 -138.56,-80" fill="url(#topFace)" />
    <!-- Highlight edge on top -->
    <line x1="0" y1="-160" x2="138.56" y2="-80" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="0" y1="-160" x2="-138.56" y2="-80" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Left Face -->
    <polygon points="-138.56,-80 0,0 0,160 -138.56,80" fill="url(#leftFace)" />

    <!-- Right Face -->
    <polygon points="0,0 138.56,-80 138.56,80 0,160" fill="url(#rightFace)" />

    <!-- Inner 3D Central Edge Glow -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Floating 3D "M" Monogram in Center -->
    <g transform="translate(0, 10)">
      <!-- Drop shadow for the letter M -->
      <path d="M -70 50 L -70 -50 L -25 5 L 0 -22 L 25 5 L 70 -50 L 70 50 L 45 50 L 45 -5 L 20 22 L 0 0 L -20 22 L -45 -5 L -45 50 Z" 
            fill="#090d16" opacity="0.6" transform="translate(0, 10) scale(1.1)"/>
      
      <!-- Base letter M with rich gradient -->
      <path d="M -70 50 L -70 -50 L -25 5 L 0 -22 L 25 5 L 70 -50 L 70 50 L 45 50 L 45 -5 L 20 22 L 0 0 L -20 22 L -45 -5 L -45 50 Z" 
            fill="url(#mGrad)" 
            stroke="#ffffff" 
            stroke-width="3" 
            stroke-linejoin="round"
            filter="url(#glow)"/>

      <!-- Glowing Core Dot -->
      <circle cx="0" cy="-22" r="6" fill="#38bdf8" filter="url(#glow)"/>
    </g>
  </g>
</svg>

